# /etc/nginx/sites-available/papermind -- TLS terminated here, API on 127.0.0.1:8000.
# The frontend is on Vercel and calls this origin directly (CORS_ORIGINS in .env).

server {
    listen 443 ssl http2;
    server_name api.papermind.example;

    ssl_certificate     /etc/letsencrypt/live/api.papermind.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.papermind.example/privkey.pem;

    client_max_body_size 45m;   # settings.max_upload_mb is 40

    # The chat endpoint streams Server-Sent Events. Buffering would hold the
    # whole answer until the turn ends, so it is off here (the API also sends
    # X-Accel-Buffering: no), and the read timeout outlives a slow agent turn.
    location /api/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name api.papermind.example;
    return 301 https://$host$request_uri;
}
