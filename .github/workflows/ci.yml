name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: .venv/bin/ruff check papermind mcp_servers evals scripts tests
      # Unit tests need no Redis, Neo4j, network or API key -- that is the point
      # of the split. Integration and eval suites run locally or on demand.
      - name: Unit tests
        env:
          WANDB_MODE: disabled
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
