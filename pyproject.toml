[project]
name = "papermind"
version = "0.1.0"
description = "A research-paper reading agent that explains at your level"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["papermind*", "mcp_servers*", "evals*", "training*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "evals"]
markers = [
    "integration: needs Redis/Neo4j/network (deselected by default)",
    "eval: runs the benchmark against the live API and spends money (deselected by default)",
]
addopts = "-m 'not integration and not eval' -q"
filterwarnings = [
    "ignore::DeprecationWarning:fitz.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
