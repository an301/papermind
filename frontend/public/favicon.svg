<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A dog-eared page with a lowercase p: your copy, worked through. Ink only; mulberry is reserved for the assistant's marks. -->
  <style>
    .page { fill: #222123 }
    .fold { fill: #868588 }
    .p { stroke: #F7F6F9 }
    @media (prefers-color-scheme: dark) {
      .page { fill: #E6E6E8 }
      .fold { fill: #79787B }
      .p { stroke: #1F1F21 }
    }
  </style>
  <path class="page" d="M7 1h14.5L31 10.5V25a6 6 0 0 1-6 6H7a6 6 0 0 1-6-6V7a6 6 0 0 1 6-6Z"/>
  <path class="fold" d="M21.5 1v6.5a3 3 0 0 0 3 3H31Z"/>
  <g class="p" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 13.5V27"/>
    <circle cx="15.75" cy="18" r="4.75"/>
  </g>
</svg>
