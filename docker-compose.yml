# Development services for PaperMind: Redis (session state) and Neo4j (concept graph).
#
#   docker compose up -d
#   docker compose ps          # both should report (healthy)
#   docker compose down        # stop, keep data
#   docker compose down -v     # stop and DESTROY the graph — you will re-seed
#
# The app itself is not containerised here. It runs on the host with
# `uvicorn --reload` so the local model stays loaded across code changes and can
# see the GPU directly.

services:
  redis:
    image: redis:8-alpine
    container_name: papermind-redis
    ports:
      - "6379:6379"
    # AOF is on for developer convenience only — sessions carry a 24h TTL and are
    # by definition disposable. It just means a `compose restart` doesn't log you out.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: papermind-neo4j
    ports:
      - "7474:7474"   # Browser UI — http://localhost:7474
      - "7687:7687"   # Bolt — the driver connects here
    environment:
      # Must match NEO4J_USER / NEO4J_PASSWORD in .env.
      NEO4J_AUTH: neo4j/papermind-dev
      NEO4J_PLUGINS: '["apoc"]'
      # The graph is ~350 concept nodes plus per-user KNOWS edges. It fits in a
      # rounding error of RAM; these values just stop Neo4j reserving gigabytes
      # on a laptop that is also running a 7B model.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache__size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      # Cypher seeds, mounted read-only for cypher-shell.
      - ./infra/neo4j:/seed:ro
    healthcheck:
      # Bolt readiness, not just process liveness — the driver fails on a Neo4j
      # that is up but still recovering.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p papermind-dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:
